<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — UniAssist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#15457A; --navy-600:#1b5698; --orange:#E8762C; --orange-600:#d3641c; --ink:#1b2430; --muted:#6b7688; --border:#e7ebf1; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "IBM Plex Sans Thai","Segoe UI",Tahoma,sans-serif; color: var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background:
      radial-gradient(1100px 460px at 100% -10%, #e7f0fb 0%, transparent 60%),
      radial-gradient(900px 420px at -10% 110%, #fde8d6 0%, transparent 55%),
      #f5f7fb;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 22px; width: 100%; max-width: 420px;
    padding: 40px 34px; text-align: center; box-shadow: 0 20px 60px rgba(16,24,40,.12);
  }
  .logo {
    width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 18px; font-size: 30px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--navy), var(--navy-600)); box-shadow: 0 8px 20px rgba(21,69,122,.32);
  }
  h1 { font-size: 24px; margin: 0 0 6px; color: var(--navy); letter-spacing: -.4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 26px; line-height: 1.55; }
  .gbtn {
    width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 18px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 12px; background: #fff; color: var(--ink);
    text-decoration: none; transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .gbtn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(16,24,40,.1); border-color: #d4dbe6; }
  .gbtn svg { width: 20px; height: 20px; }
  .foot { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .foot b { color: var(--navy); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">U</div>
    <h1>UniAssist</h1>
    <p class="sub">ผู้ช่วยนักศึกษาคณะเทคโนโลยีสารสนเทศ · KMITL<br>กรุณาเข้าสู่ระบบด้วยบัญชี Google เพื่อใช้งาน</p>
    <a class="gbtn" href="/auth/login">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.2 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16z"/>
        <path fill="#FBBC05" d="M10.5 28.3c-.5-1.4-.8-2.9-.8-4.3s.3-2.9.8-4.3l-7.9-6.1C1 16.9 0 20.3 0 24s1 7.1 2.6 10.4l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.4 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.3 0-11.6-3.7-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      เข้าสู่ระบบด้วย Google
    </a>
    <div class="foot">
      ระบบจะแยกบทบาท <b>นักศึกษา</b> / <b>อาจารย์ที่ปรึกษา</b> จากอีเมลอัตโนมัติ<br>
      (อีเมลนักศึกษา = รหัสนักศึกษา@kmitl.ac.th)
    </div>
  </div>
</body>
</html>
